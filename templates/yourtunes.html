<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YourTunes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/yourtunes.css') }}" />
    <link rel="icon" href="{{ url_for('static', filename='image/logo.ico') }}" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jersey 10', sans-serif;
            letter-spacing: 1.5px;
            background-color: #1a1a1a;
            color: #ffffff;
        }
        .progress-container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin: 20px auto;
            max-width: 600px;
        }
        .mood-circle {
            width: 120px;
            height: 120px;
            margin: 10px;
            position: relative;
        }
        .progress-bar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(#8a2be2 0deg, transparent 0deg);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(138, 43, 226, 0.5);
            position: relative;
        }
        .progress-bar::before {
            content: "";
            position: absolute;
            width: 80%;
            height: 80%;
            background-color: rgba(26, 26, 26, 0.8);
            border-radius: 50%;
            border: 2px solid #8a2be2;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .progress-text {
            position: absolute;
            z-index: 1;
            font-size: 1.2em;
            font-weight: bold;
            color: #ffffff;
            text-align: center;
            text-shadow: 0 0 5px rgba(138, 43, 226, 0.8);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <h1>Music's in the mix! Tap play and turn up!</h1>

    <div class="note" style="left: 20%; animation-duration: 4s">♪</div>
    <div class="note" style="left: 40%; animation-duration: 5s">♬</div>
    <div class="note" style="left: 60%; animation-duration: 6s">♫</div>
    <div class="note" style="left: 80%; animation-duration: 7s">♩</div>

    <script>
      function getPlaylistIdFromUrl(playlist_url) {
        if (playlist_url.includes("open.spotify.com/playlist/")) {
          const playlistId = playlist_url.split("open.spotify.com/playlist/")[1].split("?")[0];
          return playlistId;
        } else {
          return null;
        }
      }

      const playlistId = getPlaylistIdFromUrl("{{ playlist_url }}");

      if (playlistId) {
        const embedUrl = `https://open.spotify.com/embed/playlist/${playlistId}`;
        const iframe = document.createElement("iframe");
        iframe.src = embedUrl;
        iframe.width = "55%";
        iframe.height = "120%";
        iframe.frameBorder = "0";
        iframe.allowTransparency = "true";
        iframe.allow = "encrypted-media";
        document.body.appendChild(iframe);
      } else {
        const errorMessage = document.createElement("p");
        errorMessage.textContent = "Invalid Spotify playlist URL.";
        document.body.appendChild(errorMessage);
      }

      const notes = document.querySelectorAll(".note");
      notes.forEach((note) => {
        note.style.animationDuration = `${Math.random() * 3 + 3}s`;
        note.style.left = `${Math.random() * 100}vw`;
      });

      // MOOD Progress Bars
      function updateProgressBars() {
          const progressContainer = document.querySelector('.progress-container');
          progressContainer.innerHTML = '';

          {% if mood_results %}
              {% for mood, percentage in mood_results.items() %}
                  const moodCircle = document.createElement('div');
                  moodCircle.className = 'mood-circle';
                  
                  const progressBar = document.createElement('div');
                  progressBar.className = 'progress-bar';
                  
                  const progressText = document.createElement('div');
                  progressText.className = 'progress-text';
                  progressText.textContent = `{{ mood }}: {{ percentage|round(2) }}%`;
                  
                  const degrees = ({{ percentage }} / 100) * 360;
                  progressBar.style.background = `conic-gradient(#8a2be2 ${degrees}deg, transparent ${degrees}deg)`;
                  
                  progressBar.appendChild(progressText);
                  moodCircle.appendChild(progressBar);
                  progressContainer.appendChild(moodCircle);
              {% endfor %}
          {% else %}
              const noDataMessage = document.createElement('p');
              noDataMessage.textContent = 'No mood data available.';
              progressContainer.appendChild(noDataMessage);
          {% endif %}
      }

      // Call the function to update the progress bars
      window.onload = updateProgressBars;
    </script>

    <div class="music">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <div class="progress-container"></div>

    <a href="{{ url_for('home') }}">
      <button class="home-btn">Home</button>
    </a>
</body>
</html>
