<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YourTunes</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/yourtunes.css') }}"
    />
    <link rel="icon" href="{{ url_for('static', filename='image/logo.ico') }}" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jersey 10', sans-serif;
            letter-spacing: 1.5px;
        }
    </style>
  </head>
  <body>
    <h1>Music’s in the mix! Tap play and turn up!</h1>

    <div class="note" style="left: 20%; animation-duration: 4s">♪</div>
    <div class="note" style="left: 40%; animation-duration: 5s">♬</div>
    <div class="note" style="left: 60%; animation-duration: 6s">♫</div>
    <div class="note" style="left: 80%; animation-duration: 7s">♩</div>

    <script>
      function getPlaylistIdFromUrl(playlist_url) {
        if (playlist_url.includes("open.spotify.com/playlist/")) {
          const playlistId = playlist_url
            .split("open.spotify.com/playlist/")[1]
            .split("?")[0];
          return playlistId;
        } else {
          return null;
        }
      }

      const playlistId = getPlaylistIdFromUrl("{{ playlist_url }}");

      if (playlistId) {
        const embedUrl = `https://open.spotify.com/embed/playlist/${playlistId}`;
        const iframe = document.createElement("iframe");
        iframe.src = embedUrl;
        iframe.width = "55%";
        iframe.height = "120%";
        iframe.frameBorder = "0";
        iframe.allowTransparency = "true";
        iframe.allow = "encrypted-media";

        document.body.appendChild(iframe);
      } else {
        const errorMessage = document.createElement("p");
        errorMessage.textContent = "Invalid Spotify playlist URL.";
        document.body.appendChild(errorMessage);
      }

      const notes = document.querySelectorAll(".note");
      notes.forEach((note) => {
        note.style.animationDuration = `${Math.random() * 3 + 3}s`;
        note.style.left = `${Math.random() * 100}vw`;
      });
    </script>

    <div class="music">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <a href="{{ url_for('home') }}">
      <button class="home-btn">Home</button>
    </a>
  </body>
</html>
