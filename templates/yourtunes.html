<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Tunes</title>
</head>
<body>
    <h1>Playlist Created Successfully!</h1>
    <p><strong>Playlist Link:</strong> <a href="{{ playlist_url }}" target="_blank">Open Playlist</a></p>
    <p>Cover Image: <img src="{{ cover_image_url }}" alt="Cover Image" width="300"></p>
    <a href="{{ url_for('home') }}">Go to Home</a>

    <script>
        function getPlaylistIdFromUrl(playlist_url) {
            if (playlist_url.includes('open.spotify.com/playlist/')) {
                // Extract the playlist ID from the URL
                const playlistId = playlist_url.split('open.spotify.com/playlist/')[1].split('?')[0];
                return playlistId;
            } else {
                return null; // Return null if the URL is not a valid Spotify playlist URL
            }
        }

        // Assuming the playlist_url is passed from the server-side code
        const playlistId = getPlaylistIdFromUrl('{{ playlist_url }}');

        if (playlistId) {
            // Create the Spotify embedded player
            const embedUrl = `https://open.spotify.com/embed/playlist/${playlistId}`;
            const iframe = document.createElement('iframe');
            iframe.src = embedUrl;
            iframe.width = '300';
            iframe.height = '380';
            iframe.frameborder = '0';
            iframe.allowtransparency = 'true';
            iframe.allow = 'encrypted-media';

            // Append the iframe to the body
            document.body.appendChild(iframe);
        } else {
            // Display an error message
            const errorMessage = document.createElement('p');
            errorMessage.textContent = 'Invalid Spotify playlist URL.';
            document.body.appendChild(errorMessage);
        }
    </script>
</body>
</html>
