<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Tunes Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background:url(https://media1.tenor.com/m/2ozCfF0hM2YAAAAC/tapes-cassette-tape.gif) no-repeat;
            background-size: cover;
            background-position: center;
        }
        .wrapper {
            width: 420px;
            background-color: transparent;
            color: white;
            border-radius: 12px;
            padding: 30px 40px;
            text-align: center; /* Center-align text inside the wrapper */
        }
        .wrapper h1 {
            font-size: 36px;
        }
        .wrapper .input-box {
            position: relative;
            width: 100%;
            height: 50px;
            margin: 30px 0;
        }
        .input-box input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            border: 2px solid rgba(225, 225, 225, .2);
            border-radius: 40px;
            font-size: 16px;
            color: black;
            padding: 20px 45px 20px 20px;
        }
        .input-box input::placeholder {
            color: black;
        }
        .input-box i {
            position: absolute;
            right: 20px;
            top: 30%;
            transform: translate(-50%);
            font-size: 20px;
        }
        .wrapper .remember-forget {
            display: flex;
            justify-content: space-between;
            font-size: 14.5px;
            margin: -15px 0 15px;
        }
        .remember-forget label input {
            accent-color: black;
            margin-right: 3px;
        }
        .remember-forget a {
            color: black;
            text-decoration: none;
        }
        .remember-forget a:hover {
            text-decoration: underline;
        }
        .wrapper .btn {
            width: 100%;
            height: 45px;
            background: white;
            border: none;
            outline: none;
            border-radius: 40px;
            box-shadow: 0 0 10px rgba(0, 0, 0, .1);
            cursor: pointer;
            font-size: 16px;
            color: black;
            font-weight: 600;
        }
        .wrapper .register-link {
            font-size: 14.5px;
            text-align: center;
            margin-top: 20px;
        }
        .register-link p a {
            color: black;
            text-decoration: none;
            font-weight: 600;
        }
        .register-link p a:hover {
            text-decoration: underline;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 10px;  /* This creates space between the buttons */
        }
        
        .btn-login {
            /* Existing styles for the main login button */
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 20px;
            background-color: white;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }
        
        .btn-spotify {
            width: 100%;
            padding: 10px;
            text-align: center;
            color: #1DB954;  
            text-decoration: none;
        }
    </style>

    <link rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

</head>
<body>
    <div class="wrapper">
        <h1>Login</h1>
        <div class="input-box">
            <input type="text" name="username" placeholder="Username" required>
            <i class='bx bxs-user-rectangle'></i>
        </div>
        <div class="input-box">
            <input type="password" name="password" placeholder="Password" required>
            <i class='bx bxs-lock'></i>
        </div>
        <div class="remember-forget">
            <label><input type="checkbox" name="remember"> Remember Me</label>
            <a href="#">Forget Password</a>
        </div>
        <div class="button-container">
            <button type="submit" class="btn btn-login">Login</button>
            <a href="/home" class="btn btn-spotify">Login with Spotify</a>
                
        </div>
        <div class="register-link">
            <p>Don't have an account? <a href="#">Register</a></p>
        </div>
    </div>
</body>
</html>
